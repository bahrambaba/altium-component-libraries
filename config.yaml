# Altium Component Libraries Configuration

jlpcb:
  enabled: true
  max_per_category: 50
  categories:
    - name: resistors
      keyword: "0402"
    - name: capacitors
      keyword: "0402 MLCC"
    - name: inductors
      keyword: "0402 inductor"
    - name: leds
      keyword: "LED 0603"
    - name: mcus_stm32
      keyword: "STM32"
    - name: mcus_esp32
      keyword: "ESP32"
    - name: connectors
      keyword: "USB Type-C"
    - name: voltage_regulators
      keyword: "LDO 3.3V"

ultra_librarian:
  enabled: false
  api_key: ""

aggregator:
  enabled: true
  max_repos: 100
  download_files: true

altium_generator:
  enabled: true
  use_altium_monkey: false
  output_format: "json"

telegram:
  enabled: true
  # Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

github:
  token_env: "GITHUB_TOKEN"
