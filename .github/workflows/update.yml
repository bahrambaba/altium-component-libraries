name: Update Altium Libraries

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-libraries:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Fetch components from JLCPCB
        run: python scripts/fetch_jlcpcb.py
      
      - name: Fetch components from Ultra Librarian
        if: ${{ secrets.ULTRA_LIB_API_KEY != '' }}
        env:
          ULTRA_LIB_API_KEY: ${{ secrets.ULTRA_LIB_API_KEY }}
        run: python scripts/fetch_ultra_librarian.py
      
      - name: Generate Altium libraries
        run: python scripts/generate_altium_libs.py
      
      - name: Create update summary
        run: python scripts/create_summary.py
      
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/ libraries/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update libraries"
          git push
